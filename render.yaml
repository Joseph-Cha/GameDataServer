# Render Blueprint — 대시보드에서 New → Blueprint로 이 저장소를 고르면
# 아래 설정 그대로 Web Service가 만들어진다. (강의안 3-5 표의 값과 같다)
services:
  - type: web
    name: gamedataserver-joseph-cha   # https://gamedataserver-joseph-cha.onrender.com
    runtime: docker
    region: singapore
    plan: free
    branch: main
    autoDeploy: true                  # git push 때마다 다시 빌드·배포
    healthCheckPath: /hello
